name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - run: npm ci --ignore-scripts
    - run: npm run typecheck
    - run: npm test -- --runInBand
    - run: npm run npm
    - run: npm pack --dry-run
